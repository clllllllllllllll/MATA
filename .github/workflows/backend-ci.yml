name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Provision exact disposable PostgreSQL database
        uses: ./.github/actions/setup-security-postgres
        with:
          container-id: ${{ job.services.postgres.id }}

      - name: Compile backend application and tests
        run: python -B -m compileall app tests
        working-directory: backend

      - name: Verify the exact single Alembic head
        shell: bash
        working-directory: backend
        run: |
          heads="$(python -B -m alembic heads)"
          test "$(printf '%s\n' "$heads" | wc -l)" -eq 1
          test "$heads" = "20260728_000028 (head)"

      - name: Run migrations
        run: python -B -m alembic upgrade head
        working-directory: backend

      - name: Verify the disposable database is at every Alembic head
        run: python -B -m alembic current --check-heads
        working-directory: backend

      - name: Run backend tests through restricted PostgreSQL roles
        env:
          RATE_LIMIT_STORE: memory
        run: >-
          python -B -m tests.run_rls_restricted_pytest
          -q --tb=short -p no:cacheprovider tests
        working-directory: backend

      - name: Run PostgreSQL rate-limit security integration
        run: >-
          python -B -m tests.run_rls_restricted_pytest
          -q --tb=short -p no:cacheprovider
          tests/test_security_postgres_integration.py
        working-directory: backend
