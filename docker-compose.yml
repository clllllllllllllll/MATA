services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mata_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mata_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mata_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mata_db
      SYNC_DATABASE_URL: postgresql://postgres:postgres@db:5432/mata_db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_DEMO_ADMIN_USER_ID: ${VITE_DEMO_ADMIN_USER_ID}
        VITE_DEMO_ADMIN_PROGRAMME_SCOPE: ${VITE_DEMO_ADMIN_PROGRAMME_SCOPE:-DR,GERI}
        VITE_DEMO_SECRETARY_USER_ID: ${VITE_DEMO_SECRETARY_USER_ID}
        VITE_DEMO_SECRETARY_SITE: ${VITE_DEMO_SECRETARY_SITE:-TTSHGerMed}
        VITE_DEMO_SECRETARY_SCOPE_LABEL: ${VITE_DEMO_SECRETARY_SCOPE_LABEL:-TTSH Geriatric Medicine}
        VITE_DEMO_RESIDENT_USER_ID: ${VITE_DEMO_RESIDENT_USER_ID}
        VITE_DEMO_RESIDENT_MCR: ${VITE_DEMO_RESIDENT_MCR:-M64471D}
        VITE_DEMO_RESIDENT_PROGRAMME: ${VITE_DEMO_RESIDENT_PROGRAMME:-GERI}
        VITE_DEFAULT_PROGRAMME_CODE: ${VITE_DEFAULT_PROGRAMME_CODE:-DR}
        VITE_DEFAULT_REPORTING_PERIOD_ID: ${VITE_DEFAULT_REPORTING_PERIOD_ID:-}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mata_postgres_data:
